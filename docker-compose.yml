services:
  postgres:
    image: postgres:16
    container_name: nexuserp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexuserp
    ports:
      - "5434:5432"
    volumes:
      - nexuserp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexuserp"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  nexuserp_pgdata:
